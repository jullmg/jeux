<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Street View du quartier</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
	:root { --blue: #1D4F91; --yellow: #FFD23F; --cream: #F4EEE6; --ink: #2B2620; }
	* { box-sizing: border-box; }
	html, body { height: 100%; margin: 0; font: 14px/1.4 system-ui, sans-serif; color: var(--ink); background: var(--cream); }
	body { display: grid; grid-template-columns: 270px 1fr minmax(360px, 42%); }
	#list { overflow-y: auto; border-right: 1px solid #d8cdbd; }
	#list h1 { font-size: 16px; margin: 0; padding: 12px; background: var(--blue); color: white; }
	#list input { width: calc(100% - 24px); margin: 10px 12px 4px; padding: 6px 8px; border: 1px solid #c9bda9; border-radius: 6px; font: inherit; }
	#list h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; margin: 12px 12px 4px; color: var(--blue); }
	#list button { display: block; width: 100%; text-align: left; padding: 5px 12px; border: 0; background: none; font: inherit; cursor: pointer; }
	#list button:hover { background: #e9dfd0; }
	#list button.on { background: var(--yellow); }
	#list small { color: #7a6f60; }
	#map { height: 100%; }
	#photo { overflow-y: auto; padding: 14px; border-left: 1px solid #d8cdbd; }
	#photo img { width: 100%; border-radius: 6px; display: block; }
	#photo h2 { margin: 10px 0 2px; font-size: 20px; }
	#photo p { margin: 2px 0; }
	#photo .details { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 10px; }
	#photo code { background: #e9dfd0; padding: 1px 4px; border-radius: 4px; word-break: break-all; }
	.pin { width: 22px; height: 22px; }
	.pin i { display: block; width: 22px; height: 22px; background: var(--blue);
		clip-path: polygon(50% 0, 88% 100%, 50% 76%, 12% 100%); }
	.pin.on i { background: #E0452B; }
	@media (max-width: 900px) { body { grid-template-columns: 1fr; grid-template-rows: 30% 35% 35%; } }
</style>
</head>
<body>
<div id="list"><h1>Street View du quartier</h1><input id="find" placeholder="Numéro ou rue…"><div id="items"></div></div>
<div id="map"></div>
<div id="photo"><p>Choisir une flèche sur la carte ou une adresse dans la liste. La flèche montre où la photo a été prise et dans quelle direction regarde l'appareil.</p></div>
<script>
const shots = /*SHOTS*/[];
const sides = {left: "côté gauche", right: "côté droit", along: "le long de la rue", face: "de face"};
const map = L.map("map");
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 19, maxNativeZoom: 19,
	attribution: "© OpenStreetMap"}).addTo(map);

// Two pictures from one panorama share a position: nudge each pin a little the way it looks.
const nudge = (s) => {
	const r = s.heading * Math.PI / 180, m = 3 / 111320;
	return [s.lat + Math.cos(r) * m, s.lng + Math.sin(r) * m / Math.cos(s.lat * Math.PI / 180)];
};
const title = (s) => s.address.split(",")[0] || s.street;
let current = -1;

shots.forEach((s, i) => {
	s.marker = L.marker(nudge(s), {icon: L.divIcon({className: "", iconSize: [22, 22],
		html: `<div class="pin" id="pin${i}"><i style="transform: rotate(${s.heading}deg)"></i></div>`})})
		.addTo(map).bindTooltip(title(s)).on("click", () => show(i));
});
if (shots.length) map.fitBounds(L.latLngBounds(shots.map((s) => [s.lat, s.lng])).pad(0.1));
else map.setView([45.55, -73.58], 15);

function list(filter) {
	const items = document.getElementById("items");
	items.innerHTML = "";
	let street = null;
	shots.forEach((s, i) => {
		if (filter && !(s.address + " " + s.street).toLowerCase().includes(filter)) return;
		if (s.street !== street) { street = s.street; items.insertAdjacentHTML("beforeend", `<h2>${street}</h2>`); }
		const b = document.createElement("button");
		b.id = "row" + i;
		b.innerHTML = `${title(s)} <small>· ${sides[s.side] || s.side}, vers le ${s.looking}</small>`;
		b.onclick = () => show(i, true);
		items.append(b);
	});
}

function show(i, fly) {
	const s = shots[i];
	for (const id of ["pin", "row"]) {
		document.getElementById(id + current)?.classList.remove("on");
		document.getElementById(id + i)?.classList.add("on");
	}
	current = i;
	if (fly) map.setView([s.lat, s.lng], Math.max(map.getZoom(), 19));
	document.getElementById("row" + i)?.scrollIntoView({block: "nearest"});
	document.getElementById("photo").innerHTML = `
		<a href="${s.file}" target="_blank"><img src="${s.file}" alt=""></a>
		<h2>${title(s)}</h2>
		<p>${s.address}${s.approx ? " <small>(adresse approximative : la plus proche de ce que regarde l'appareil)</small>" : ""}</p>
		<p>${sides[s.side] || s.side}, appareil tourné vers le ${s.looking} (${s.heading}°) · image de ${s.date || "date inconnue"}</p>
		<p>Prise à ${s.lat}, ${s.lng} · <a href="${s.maps}" target="_blank">ouvrir dans Google Maps</a></p>
		<p><code>${s.file}</code></p>
		<div class="details">${s.details.map((d) => `<a href="${d}" target="_blank"><img src="${d}" alt=""></a>`).join("")}</div>`;
}

document.getElementById("find").oninput = (e) => list(e.target.value.trim().toLowerCase());
list("");
</script>
</body>
</html>
